# tests/soroban/docker-compose.yml
#
# Throwaway local Soroban network for contract integration tests: a single
# stellar/quickstart container running core, horizon, Soroban RPC and
# friendbot against a private standalone network.
#
# Managed by the scripts in this directory (see tests/README.md); prefer
# `make -C contracts sandbox-up` / `sandbox-down` over invoking compose directly.
#
#   RPC:        http://localhost:${SOROBAN_SANDBOX_PORT:-8000}/rpc
#   Friendbot:  http://localhost:${SOROBAN_SANDBOX_PORT:-8000}/friendbot
#   Passphrase: "Standalone Network ; February 2017"
#
# No volumes are declared: all ledger state lives in the container and is
# discarded by `docker compose down -v`.

services:
  soroban-sandbox:
    image: ${SOROBAN_QUICKSTART_IMAGE:-stellar/quickstart:latest}
    container_name: ${SOROBAN_COMPOSE_PROJECT:-airflex-soroban-test}-node
    command: ${SOROBAN_QUICKSTART_ARGS:---local --enable core,horizon,rpc}
    ports:
      - "${SOROBAN_SANDBOX_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf -X POST http://localhost:8000/rpc
          -H 'Content-Type: application/json'
          -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}'
          | grep -q healthy
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
